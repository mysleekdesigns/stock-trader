[alembic]
# Path to migration scripts.
script_location = migrations

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long revision identifiers in file names.
truncate_slug_length = 40

# Set to 'true' to apply each revision to a fresh database.
revision_environment = false

# Set to 'true' to run the environment during 'revision --autogenerate'.
# Required for autogenerate to pick up target_metadata.
sourceless = false

# Timezone to use when generating migration file names.
timezone = UTC

# Placeholder — overridden at runtime by migrations/env.py using settings.
sqlalchemy.url = postgresql+asyncpg://trader:trader@localhost:5432/stocktrader

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
