;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Stock Trader — Supervisord Process Management
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Programs
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[program:api-server]
command=gunicorn src.api.app:app
    --worker-class uvicorn.workers.UvicornWorker
    --workers 4
    --bind 0.0.0.0:8000
    --timeout 120
    --graceful-timeout 30
    --keep-alive 5
    --access-logfile -
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=100
redirect_stderr=true
stdout_logfile=/var/log/supervisor/api-server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30
stopsignal=TERM
environment=ENVIRONMENT="production",LOG_LEVEL="info"

[program:trading-engine]
command=python -m src.engine.main
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=15
priority=200
redirect_stderr=true
stdout_logfile=/var/log/supervisor/trading-engine.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
stopsignal=TERM
environment=ENVIRONMENT="production",LOG_LEVEL="info"

[program:celery-worker]
command=celery -A src.tasks.celery_app worker
    --loglevel=info
    --concurrency=4
    --max-tasks-per-child=1000
    --without-heartbeat
    --without-mingle
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=300
redirect_stderr=true
stdout_logfile=/var/log/supervisor/celery-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=120
stopsignal=TERM
killasgroup=true
stopasgroup=true
environment=ENVIRONMENT="production"

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Group
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[group:stocktrader]
programs=api-server,trading-engine,celery-worker
priority=999
