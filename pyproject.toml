[project]
name = "stock-trader"
version = "0.1.0"
description = "Production-grade algorithmic trading bot and web dashboard"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "orjson>=3.10.0",
    # Data
    "yfinance>=0.2.48",
    "alpaca-py>=0.33.0",
    "polygon-api-client>=1.14.0",
    # ML
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "torch>=2.5.0",
    "pytorch-forecasting>=1.2.0",
    "scikit-learn>=1.6.0",
    "stable-baselines3>=2.4.0",
    "optuna>=4.1.0",
    # Features
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "ta>=0.11.0",
    "joblib>=1.5.3",
]

[project.scripts]
trader = "src.main:main"

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
